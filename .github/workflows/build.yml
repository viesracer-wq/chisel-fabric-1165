name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16
      - name: Fetch Chisel Fabric sources
        run: |
          curl -L "https://user.uploads.dev/file/85817de25c1ff6b52adeefc9eede372a.zip" -o src.zip
          unzip -q src.zip
          ls
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.3
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chisel-fabric-jar
          path: build/libs/*.jar
